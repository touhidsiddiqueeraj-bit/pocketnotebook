name: Release APK

# Push a tag (e.g. v0.1.0-alpha.1) to build the full native release APK and
# attach it to a GitHub Release.
#
# Signing priority (see app/build.gradle.kts):
#   1. repo secrets RELEASE_KEYSTORE_BASE64 / _PASSWORD / _KEY_ALIAS / _KEY_PASSWORD
#      (recommended for a real signing identity)
#   2. the committed sideload keystore (keystores/upload.p12) — keeps sideload
#      updates signature-stable for personal use. Rotate it before Play Store.
#   3. debug key (last resort)

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  LLAMA_REF: '6cb3e672e8d10fd4feab1a048bf2967c40623133'

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing (if secrets configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "PN_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "PN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PN_KEY_ALIAS=$KEY_ALIAS"
            echo "PN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Clone llama.cpp (pinned)
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp native/llama.cpp
          cd native/llama.cpp
          git fetch --depth 1 origin "$LLAMA_REF"
          git checkout FETCH_HEAD

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: native-${{ env.LLAMA_REF }}-${{ hashFiles('app/src/main/cpp/**') }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK (native engine)
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Rename APK + checksums
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "PocketNotebook-${{ github.ref_name }}-arm64.apk"
          sha256sum "PocketNotebook-${{ github.ref_name }}-arm64.apk" > "checksums-${{ github.ref_name }}.txt"

      - name: Create GitHub Release & attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PocketNotebook-${{ github.ref_name }}-arm64.apk
            checksums-${{ github.ref_name }}.txt
          generate_release_notes: true
          body: |
            **PocketNotebook ${{ github.ref_name }}** — offline NotebookLM clone for Android.

            * Install: sideload the APK (allow "install unknown apps"). arm64-v8a, Android 8.0+.
            * Models download on first run (LFM3-1.7B ~1 GB + bge-small embeddings 35 MB) — the APK stays ~80 MB.
            * Engine: llama.cpp @ ${{ env.LLAMA_REF }}, statically linked.
            * Voice typing and audio-overview narration use the device speech services in this build; LFM3-Audio-2B native voice lands after the Phase 0 spike (#1).
