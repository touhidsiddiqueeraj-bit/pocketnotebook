name: Release APK

# Push a tag (e.g. v0.1.0) to build a release APK and attach it to a GitHub Release.
#
# Signing: if the repo secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD are set, the APK is signed with that
# keystore. Until then it falls back to the debug key, which is still installable
# by sideloading. To set up real signing:
#   keytool -genkey -v -keystore release.keystore -alias pocketnotebook \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore  -> RELEASE_KEYSTORE_BASE64 secret
#   plus the three password/alias secrets.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing (if secrets configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "PN_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "PN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PN_KEY_ALIAS=$KEY_ALIAS"
            echo "PN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "PocketNotebook-${{ github.ref_name }}.apk"

      - name: Create GitHub Release & attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: PocketNotebook-${{ github.ref_name }}.apk
          generate_release_notes: true
