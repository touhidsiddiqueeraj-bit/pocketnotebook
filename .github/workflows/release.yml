name: Release APK

# Push a tag (e.g. v0.1.0-alpha.1) to build the full native release APK and
# attach it to a GitHub Release.
#
# Signing priority (see app/build.gradle.kts):
#   1. repo secrets RELEASE_KEYSTORE_BASE64 / _PASSWORD / _KEY_ALIAS / _KEY_PASSWORD
#      (recommended for a real signing identity)
#   2. the committed sideload keystore (keystores/upload.p12) — keeps sideload
#      updates signature-stable for personal use. Rotate it before Play Store.
#   3. debug key (last resort)

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  LLAMA_REF: '6cb3e672e8d10fd4feab1a048bf2967c40623133'

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing (if secrets configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "PN_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "PN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PN_KEY_ALIAS=$KEY_ALIAS"
            echo "PN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Clone llama.cpp (pinned)
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp native/llama.cpp
          cd native/llama.cpp
          git fetch --depth 1 origin "$LLAMA_REF"
          git checkout FETCH_HEAD

      - name: OpenCL stub for the Adreno GPU backend
        # The ggml OpenCL backend (GGML_OPENCL=ON in app/src/main/cpp/CMakeLists.txt)
        # links against libOpenCL.so. Android does not ship an NDK OpenCL, so:
        #   1. install the NDK (AGP would download it anyway; doing it here lets
        #      us place the stub inside its sysroot first)
        #   2. build the Khronos ICD loader for arm64 as a build-time stub
        #   3. drop the stub + Khronos CL headers into the NDK sysroot
        # At RUNTIME the dependency resolves to the device's own vendor
        # libOpenCL.so (a public library on many Snapdragon devices) — the
        # stub is never shipped. ROMs that do not expose libOpenCL.so to
        # apps reject the whole GPU engine at dlopen time — which is why the
        # CPU engine stays the standard APK and this OpenCL engine ships
        # only in the experimental -gpu APK (PocketLlm.kt falls back to the
        # CPU engine when the GPU lib is absent).
        run: |
          set -euxo pipefail
          NDK_VER=27.0.12077973
          NDK="$ANDROID_HOME/ndk/$NDK_VER"
          # Verify the actual artifact we need, not the directory: sdkmanager
          # creates the NDK dir long before the install finishes, and a
          # transient sdkmanager failure leaves a partial dir behind.
          NDK_OK() { [ -f "$NDK/build/cmake/android.toolchain.cmake" ]; }
          if ! NDK_OK; then
            SDKMGR=""
            for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              [ -x "$c" ] && SDKMGR="$c" && break
            done
            if [ -z "$SDKMGR" ]; then
              curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
              unzip -q /tmp/clt.zip -d /tmp/clt
              SDKMGR=/tmp/clt/cmdline-tools/bin/sdkmanager
            fi
            # `yes |` trips pipefail when sdkmanager closes the pipe (yes gets
            # SIGPIPE) — the pipeline status is meaningless here; decide on the
            # toolchain file instead. Keep sdkmanager's output: a partial
            # download must be visible in the log when it retries/fails.
            for attempt in 1 2 3; do
              yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VER" >/tmp/sdkmgr.log 2>&1 || true
              NDK_OK && break
              echo "--- NDK install attempt $attempt incomplete; last sdkmanager output: ---"
              tail -5 /tmp/sdkmgr.log || true
              rm -rf "$NDK"
              sleep 5
            done
            NDK_OK || { echo "FATAL: NDK $NDK_VER did not install"; cat /tmp/sdkmgr.log; exit 1; }
          fi
          cd "$RUNNER_TEMP"
          git clone -q --depth 1 --branch v2026.05.29 https://github.com/KhronosGroup/OpenCL-Headers
          git clone -q --depth 1 --branch v2026.05.29 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_static \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$RUNNER_TEMP/OpenCL-Headers"
          cmake --build icd-build -j "$(nproc)"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cp -r OpenCL-Headers/CL "$SYSROOT/usr/include/"
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android/"
          mkdir -p "$SYSROOT/usr/lib/aarch64-linux-android/26"
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android/26/"
          echo "--- stub NEEDED entries (must not contain libc++_shared.so) ---"
          readelf -d icd-build/libOpenCL.so | grep NEEDED || true

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: native-${{ env.LLAMA_REF }}-${{ hashFiles('app/src/main/cpp/**') }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Two engine variants, one APK each (see app/src/main/cpp/CMakeLists.txt):
      #   standard = CPU engine (libpocketllm.so)  — loads on every device
      #   -gpu     = OpenCL engine (libpocketllm_ocl.so) — Adreno acceleration,
      #              only on ROMs that expose libOpenCL.so to apps.
      # PocketLlm.kt tries the GPU lib first and falls back to the CPU lib.
      - name: Assemble release APK (CPU engine — standard)
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PgpuOpencl=false --stacktrace

      - name: Verify 16 KB compliance (CPU APK)
        # Gate: newer Android (15/16) devices reject 4 KB-aligned native libs
        # at load time — the exact cause of the v0.1.0-alpha.1 launch crash.
        run: python3 scripts/check_16k_alignment.py app/build/outputs/apk/release/app-release.apk

      - name: Rename CPU APK
        run: mv app/build/outputs/apk/release/app-release.apk "PocketNotebook-${{ github.ref_name }}-arm64.apk"

      - name: Assemble release APK (OpenCL GPU engine — experimental)
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PgpuOpencl=true --stacktrace

      - name: Verify 16 KB compliance (GPU APK)
        run: python3 scripts/check_16k_alignment.py app/build/outputs/apk/release/app-release.apk

      - name: Rename GPU APK + checksums
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "PocketNotebook-${{ github.ref_name }}-arm64-gpu.apk"
          sha256sum "PocketNotebook-${{ github.ref_name }}-arm64.apk" \
                    "PocketNotebook-${{ github.ref_name }}-arm64-gpu.apk" > "checksums-${{ github.ref_name }}.txt"

      - name: Create GitHub Release & attach APKs
        uses: softprops/action-gh-release@v3
        with:
          files: |
            PocketNotebook-${{ github.ref_name }}-arm64.apk
            PocketNotebook-${{ github.ref_name }}-arm64-gpu.apk
            checksums-${{ github.ref_name }}.txt
          generate_release_notes: true
          body: |
            **PocketNotebook ${{ github.ref_name }}** — offline NotebookLM clone for Android.

            **Pick ONE APK:**
            * `PocketNotebook-…-arm64.apk` — **standard: CPU engine**, loads on every device. When in doubt, this one.
            * `PocketNotebook-…-arm64-gpu.apk` — **experimental: OpenCL/Adreno GPU engine**. Model layers offload to the GPU on ROMs that expose `libOpenCL.so` to apps; if onboarding shows an engine error, your ROM does not — install the standard APK instead (same signature, installs right over).

            * Install: sideload the APK (allow "install unknown apps"). arm64-v8a, Android 8.0+.
            * Models download on first run (LFM3-1.7B ~1 GB + bge-small embeddings 35 MB) — the APK stays ~80 MB.
            * Engine: llama.cpp @ ${{ env.LLAMA_REF }}, statically linked; the CPU engine always loads, the OpenCL engine is opt-in.
            * Check what actually loaded: Settings → Diagnostics → "engine lib" and "GPU" lines.
            * Voice typing and audio-overview narration use the device speech services in this build; LFM3-Audio-2B native voice lands after the Phase 0 spike (#1).
