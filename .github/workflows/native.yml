name: Native build

# Full APK with the real llama.cpp engine (arm64-v8a):
#   1. clone llama.cpp at the pinned commit into native/llama.cpp
#   2. gradle externalNativeBuild static-links libllama into libpocketllm.so
#   3. signed (sideload keystore) release APK artifact
#
# The pinned commit can be overridden via workflow_dispatch.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp commit/branch to build'
        default: '6cb3e672e8d10fd4feab1a048bf2967c40623133'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_REF: ${{ github.event.inputs.llama_ref || '6cb3e672e8d10fd4feab1a048bf2967c40623133' }}

jobs:
  native-release:
    name: Full native release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Clone llama.cpp (pinned)
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp native/llama.cpp
          cd native/llama.cpp
          git fetch --depth 1 origin "$LLAMA_REF"
          git checkout FETCH_HEAD
          echo "llama.cpp at: $(git rev-parse HEAD)"

      - name: OpenCL stub for the Adreno GPU backend
        # The ggml OpenCL backend (GGML_OPENCL=ON in app/src/main/cpp/CMakeLists.txt)
        # links against libOpenCL.so. Android does not ship an NDK OpenCL, so:
        #   1. install the NDK (AGP would download it anyway; doing it here lets
        #      us place the stub inside its sysroot first)
        #   2. build the Khronos ICD loader for arm64 as a build-time stub
        #   3. drop the stub + Khronos CL headers into the NDK sysroot
        # At RUNTIME the dependency resolves to the device's own vendor
        # libOpenCL.so (a public library on Snapdragon devices) — the stub is
        # never shipped. Devices without a public libOpenCL.so must build with
        # -PgpuOpencl=false (CPU-only).
        run: |
          set -euxo pipefail
          NDK_VER=27.0.12077973
          NDK="$ANDROID_HOME/ndk/$NDK_VER"
          if [ ! -d "$NDK" ]; then
            SDKMGR=""
            for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              [ -x "$c" ] && SDKMGR="$c" && break
            done
            if [ -z "$SDKMGR" ]; then
              curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
              unzip -q /tmp/clt.zip -d /tmp/clt
              SDKMGR=/tmp/clt/cmdline-tools/bin/sdkmanager
            fi
            yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VER" >/dev/null
          fi
          cd "$RUNNER_TEMP"
          git clone -q --depth 1 --branch v2026.05.29 https://github.com/KhronosGroup/OpenCL-Headers
          git clone -q --depth 1 --branch v2026.05.29 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_static \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$RUNNER_TEMP/OpenCL-Headers"
          cmake --build icd-build -j "$(nproc)"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cp -r OpenCL-Headers/CL "$SYSROOT/usr/include/"
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android/"
          mkdir -p "$SYSROOT/usr/lib/aarch64-linux-android/26"
          cp icd-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android/26/"
          echo "--- stub NEEDED entries (must not contain libc++_shared.so) ---"
          readelf -d icd-build/libOpenCL.so | grep NEEDED || true

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: native-${{ env.LLAMA_REF }}-${{ hashFiles('app/src/main/cpp/**') }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK (native engine, signed)
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Verify 16 KB page-size compliance
        # Gate: newer Android (15/16) devices reject 4 KB-aligned native libs
        # at load time — the exact cause of the v0.1.0-alpha.1 launch crash.
        run: python3 scripts/check_16k_alignment.py app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             PocketNotebook-native-arm64-${{ github.sha }}.apk

      - name: Upload full APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PocketNotebook-native-arm64
          path: PocketNotebook-native-arm64-${{ github.sha }}.apk
          retention-days: 30

      - name: SHA256
        run: sha256sum PocketNotebook-native-arm64-*.apk | tee checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: PocketNotebook-native-checksums
          path: checksums.txt
          retention-days: 30
