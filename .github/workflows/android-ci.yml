name: Android CI

# Fast "kit" validation: JVM tests, lint and a Kotlin-only APK (no native
# engine, -PskipNative). Full native builds live in native.yml / release.yml.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kit build, test & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PskipNative=true --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug -PskipNative=true --stacktrace

      - name: Assemble kit APK (no native engine)
        run: ./gradlew assembleDebug -PskipNative=true --stacktrace

      - name: Upload kit APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketNotebook-kit-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
